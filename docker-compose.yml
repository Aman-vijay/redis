services:
  redis:
    image: redis:7-alpine
    container_name: redis_practice
    ports:
      - "6379:6379"
    command: ["redis-server","--appendonly","yes"]
    volumes:
      - redis-data:/data

  mongo:
    image: mongo:7
    container_name: mongo_prac
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: redis_with_mongo
    volumes:
      - mongo-data:/data/db


volumes:
  redis-data:
  mongo-data:    